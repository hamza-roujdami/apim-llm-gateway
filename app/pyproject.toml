[project]
name = "gateway-agent"
version = "0.1.0"
description = "Microsoft Agent Framework agent that calls models through the APIM LLM gateway"
requires-python = ">=3.13"
dependencies = [
    "agent-framework-openai>=1.17,<2",
    "pydantic-settings>=2.6,<3",
]

[project.optional-dependencies]
# For GATEWAY_AUTH=entra: token provider for managed identities and app registrations.
entra = [
    "azure-identity>=1.19",
    "aiohttp>=3.9",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[project.scripts]
gateway-agent = "gateway_agent.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gateway_agent"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
